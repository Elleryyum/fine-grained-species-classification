seed: 42

dataset:
  root: data/raw
  train_annotations: data/raw/train_mini.json
  test_annotations: data/raw/val.json
  output_dir: data/processed/inat500_seed42
  num_classes: 500
  train_per_class: 40
  val_per_class: 10
  test_per_class: 10
  image_size: 224

model:
  architecture: resnet50
  pretrained: false

training:
  epochs: 40
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  augmentation: true
  num_workers: 2

run:
  name: resnet50_scratch
  checkpoint_dir: checkpoints
  output_dir: outputs
  save_every: 5

